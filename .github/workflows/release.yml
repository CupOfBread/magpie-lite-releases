name: Release

# Builds magpie and publishes the files. A v* tag on CupOfBread/magpie-lite
# dispatches here. Nothing else runs: no signing, no notarisation, no notes
# from a model, no Homebrew tap, no copy back to the source repo.

on:
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref of CupOfBread/magpie-lite to build (tag or branch)'
        required: true
        type: string
      version:
        description: 'Version to release (e.g., 0.1.0 — no v prefix)'
        required: true
        type: string
      publish:
        description: 'Publish the release (off: build only, as a dry run)'
        type: boolean
        default: true

env:
  REF: ${{ github.event.client_payload.ref || github.event.inputs.ref }}
  VERSION: ${{ github.event.client_payload.version || github.event.inputs.version }}

jobs:
  # The macOS app links the system webview through cgo, so it builds on a
  # macOS runner, Apple Silicon only.
  mac:
    runs-on: macos-latest

    steps:
      - name: Checkout magpie source code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: CupOfBread/magpie-lite
          ssh-key: ${{ secrets.MAGPIE_DEPLOY_KEY }}
          ref: ${{ env.REF }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build magpie.app
        run: make app VERSION="$VERSION"

      - name: Build dmg and zip
        run: |
          DMG=magpie-darwin-arm64.dmg
          mkdir -p $RUNNER_TEMP/dmg
          cp -R magpie.app $RUNNER_TEMP/dmg/
          ln -s /Applications $RUNNER_TEMP/dmg/Applications
          # hdiutil fails now and then with "Resource busy" while something
          # still holds the image it makes; a retry keeps the release alive.
          for try in 1 2 3 4 5; do
            hdiutil create -volname magpie -srcfolder $RUNNER_TEMP/dmg -ov -format UDZO "$DMG" && break
            [ "$try" = 5 ] && exit 1
            echo "hdiutil create failed (try $try), trying again"
            rm -f "$DMG"
            sleep $((try * 10))
          done
          ditto -c -k --keepParent magpie.app magpie-darwin-arm64.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: build-darwin-arm64
          path: |
            magpie-darwin-arm64.dmg
            magpie-darwin-arm64.zip
          if-no-files-found: error

  # The terminal-only build and the Windows app need no cgo, so they
  # cross-compile from one Linux runner.
  cli:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout magpie source code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: CupOfBread/magpie-lite
          ssh-key: ${{ secrets.MAGPIE_DEPLOY_KEY }}
          ref: ${{ env.REF }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: make release-cli release-windows VERSION="$VERSION"

      - name: Upload build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: build-cli
          path: |
            dist/magpie-cli-*
            dist/magpie-windows-*.exe
          if-no-files-found: error

  publish:
    needs: [mac, cli]
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: v${{ env.VERSION }}
          name: magpie v${{ env.VERSION }}
          draft: false
          body: |
            ### Files

            - **macOS (Apple Silicon):** `magpie-darwin-arm64.dmg`, or `magpie-darwin-arm64.zip`
            - **Windows (amd64):** `magpie-windows-amd64.exe`
            - **Terminal only:** `magpie-cli-darwin-arm64`, `magpie-cli-windows-amd64.exe`

            `SHA256SUMS` has every file's checksum.
          files: dist/*
